<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Game</title>
    <!-- Link Favicon-->
    <link rel="icon" href="assets/images/favicon.png" type="image/png">

    <!-- Link Css-->
    <link rel="stylesheet" href="css/style.css">

    <!-- Add fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Lilita+One&family=Playwrite+BE+WAL+Guides&display=swap" rel="stylesheet">
    
</head>
<body>


    <main>
        <div class="ocean-bg-video">
            <video autoplay muted loop>
                <source src="assets/videos/ocean-background.mp4" type="video/mp4">
            </video>

            <div class="pirate-ship">
                
                <canvas id="fl1nk-game-canvas-level1" width="1400" height="950"></canvas>

            </div>
        </div>
    </main>


    <section class="game-controls">
        <div class="exit-button">
            <a href="play_game.html" class="exit-button-link">
                <img src="assets/images/exit-icon.png" alt="Exit Icon">
            </a>
        </div>

 
        <div class="scoreboard">
            <img src="assets/images/display-score.png" alt="Score Board Board" class="scoreboard-image">

            <div class="scoreboard-text">
                <img src="assets/images/game-coin.png" alt="Player Score" class="coin-img">
                <h3>SCORE</h3>
                <p id="score-value">0</p>
            </div>
        </div>

        <div class="player-life">
            <div class="player-life-board">
                <img src="assets/images/lives-board.png" alt="Player Life Board Image">
            </div>

            <div class="play-life-hearts" id="play-life-hearts">
                <img src="assets/images/heart.png" alt="Life" class="life-heart">
                <img src="assets/images/heart.png" alt="Life" class="life-heart">
                <img src="assets/images/heart.png" alt="Life" class="life-heart">
            </div>
        </div>


        <div class="key-status-content">
            <p id="key-status-text">KEY</p>
            <img src="assets/images/key-board.png" alt="Key collected"  class="key-board">
            <img src="assets/images/key2.png" alt="Key not collected"class="key-status-image">
            <img src="assets/images/green-tick.png" alt="Key collected" class="key-collected-tick">
        </div>

        <div class="game-timer">
            <img src="assets/images/timer-board.png" alt="Game timer Board" class="game-timer-board">
            <p id="timer-value"> 05:00</p>

        </div>
        


    </section>

    <!-- Load FL1NK game elements
    <script type="module" src="js/fl1nk_spirate_animation.js"></script>
    <script type="module"src="js/pirates.js"></script>
    <script type="module"src="js/coins.js"></script>
    <script type="module" src="js/key.js"></script>
    <script type="module" src="js/poison.js"></script>
    <script type="module" src="js/treasure.js"></script>

    Load player movement and start the game 
    <script src="js/player.js"></script> -->

    <!-- Load FL1NK game -->
    <script type="module" src="js/game.js"></script>



 




    <!-- Adding external icons for footer-->
    <script
     type="module" 
     src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js">
    </script>
    <script
     nomodule 
     src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js">
    </script>
    
</body>
</html>
