<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Declarations for the Home page-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Game</title>
     <!-- Add a favicon and link external CSS file-->
    <link rel="icon" href="../assets/images/favicon.webp" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
     <!-- Add external fonts from Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Lilita+One&family=Playwrite+BE+WAL+Guides&display=swap" rel="stylesheet">
    
</head>

<body>
    <!-- Display the background video, and the pirate ship -->
    <main>
        <div class="ocean-bg-video">
            <video autoplay muted loop>
                <source src="../assets/videos/level2_bg_video.mp4" type="video/mp4">
            </video>

            <!-- Create Canvas for pirate ship-->
            <div class="pirate-ship_two">
                <canvas id="fl1nk-game-canvas-level2" width="1400" height="950"></canvas>
            </div>
        </div>
    </main>

    <!-- Game Controls -->
    <section class="game-controls">
        <div class="exit-icon ">
            <a href="play_game.html" class="exit-button-link">
                <img src="../assets/images/exit-icon.webp" alt="Exit Icon">
            </a>
        </div>

        <!-- Create Scoreboard, Player Life, and Game Info Boards-->
        <div class="scoreboard">
            <img src="../assets/images/display-score.webp" alt="Score Board Board" class="scoreboard-image">

            <div class="scoreboard-text">
                <img src="../assets/images/game-coin.webp" alt="Player Score" class="coin-img">
                <h3>SCORE</h3>
                <p id="score-value">0</p>
            </div>
        </div>

        <div class="player-life">
            <div class="player-life-board">
                <img src="../assets/images/lives-board.webp" alt="Player Life Board Image">
            </div>

            <div class="play-life-hearts" id="play-life-hearts">
                <img src="../assets/images/heart.webp" alt="Life" class="life-heart">
                <img src="../assets/images/heart.webp" alt="Life" class="life-heart">
                <img src="../assets/images/heart.webp" alt="Life" class="life-heart">
            </div>
        </div>

        <div class="level2-info-board">
            <img src="../assets/images/game-status-board.webp" alt="Game Information board" class="info-board-image">
            <img src="../assets/images/green-tick.webp" alt="Green tick icon" class="key-tick" id="key-tick">
            <img src="../assets/images/green-tick.webp" alt="Green tick icon" class="shield-tick" id="shield-tick">
            <p id="game-timer-text">05:00</p>
        </div>


        <!-- Game Shield, and progress bar -->
        <div class="game_shield" id="game_shield">
            <img src="../assets/images/game_shield.webp" alt="Game Shield" class="shield_img">
            <p class="shield-title">SHIELD</p>
            <p class="shield-time" id="shield-time">10s</p>

            <div class="shield-progress-bar">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <!-- Game Info Boards-->
        <div class="level2_info_images">
            <img src="../assets/images/level2_info_sheet.webp" alt="Level 2 Instructions" class="level2_info">
            <img src="../assets/images/game_controls.webp" alt="Level 2 Instructions" class="game_controls">
        </div>



    </section>
    
    <!-- Game Victory and Loss popups-->
     <section>
        <div id="game-resut-display" class="game-resut-display">
            <div class="player_victory_display">
                <img src="../assets/images/player_won_img.webp" alt="Game victory display" id="victory-img" class="victory-img">
                <div class="victory_display_content">
                    <h1 class="victory_display_title"> LEVEL COMPLETE!</h1>
                    <p id="victory_display_message">Congratulations! <br> You found the treasure!</p>
                    <p class="display_score">FINAL SCORE</p>
                    <h2 id="game_score">0</h2>
                    <button class="victory-next-level">NEXT LEVEL </button>
                    <a class="victory-exit-level" href="play_game.html">EXIT </a>

                </div>
            </div>
        </div>
    </section>


    <section>
        <div id="game-lost-display" class="game-resut-display">
            <div class="player_lost_display">
            <img src="../assets/images/player_lost_img.webp" alt="Game lost display" id="losing-img" class="losing-img">
            <div class="losing_display_content">
                <h1 class="losing_display_title">GAME OVER</h1>
                <p id="losing_display_message"> YOU LOST <br> Better Luck Next Time! </p>
                <button class="losing-next-level">REPLAY LEVEL</button>
                <a class="losing-exit-level" href="play_game.html">EXIT</a>
            </div>
            </div>
        </div>
    </section>

    <!-- Load FL1NK game -->
    <script type="module" src="../js/game.js"></script>


    <!-- Adding external icons for footer-->
    <script
     type="module" 
     src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js">
    </script>
    <script
     nomodule 
     src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js">
    </script>
    
</body>
</html>
